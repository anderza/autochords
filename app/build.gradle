plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anderza.autochords'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anderza.autochords'
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName '0.9.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
