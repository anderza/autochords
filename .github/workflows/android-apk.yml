name: Build Auto Chords APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Store downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Chords-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish preview APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview >/dev/null 2>&1 || gh release create preview --target "$GITHUB_SHA" --title "Auto Chords — предварительная APK" --notes "Экспериментальная Android-сборка. Подпись debug может меняться между сборками; для обновления поверх установленной версии понадобится постоянный ключ подписи." --prerelease --latest=false
          gh release upload preview app/build/outputs/apk/debug/app-debug.apk --clobber
