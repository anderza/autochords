name: Build AutoChords APK
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: node tests/check-html.cjs && node --test tests/analyzer.test.cjs
      - name: Set version code
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Debug checks
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Release signing
        id: sign
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo signed=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          export KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/autochords.XXXXXX")"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          gradle --no-daemon lintRelease assembleRelease
          version="$(cat VERSION)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AutoChords-v$version.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo signed=true >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: signed-apk
          path: dist/
          retention-days: 30
  publish:
    needs: build
    if: needs.build.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then [[ "$GITHUB_REF_NAME" == "$tag" ]]; fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              [[ "$(git rev-list -n 1 "$tag")" == "$GITHUB_SHA" ]]
            fi
            previous="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
            if [[ -n "$previous" ]]; then git log --oneline "$previous..$GITHUB_SHA" > notes.txt; else git log --oneline "$GITHUB_SHA" > notes.txt; fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --target "$GITHUB_SHA" --notes-file notes.txt dist/*
            fi
          fi
          if gh release view preview >/dev/null 2>&1; then gh release delete preview --yes; fi
          git tag -f preview "$GITHUB_SHA"
          git push origin refs/tags/preview --force
          gh release create preview --verify-tag --prerelease --latest=false --notes "Commit $GITHUB_SHA" dist/*
