name: AutoChords CI and signed releases

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    name: HTML, chords, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate HTML and embedded JavaScript
        run: |
          test -s app/src/main/assets/index.html
          node scripts/check-html.mjs
      - name: Test chord analyzer with real app functions
        run: node --test tests/*.test.mjs
      - name: Android lint and debug APK
        run: |
          ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - name: Upload debug APK and lint reports
        uses: actions/upload-artifact@v4
        with:
          name: AutoChords-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Signed APK, upgrade check, versioned release
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version and secret availability
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^appVersion=//p' gradle.properties | tail -n1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::appVersion must be X.Y.Z"; exit 1
          fi
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag does not match appVersion"; exit 1
          fi
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "No complete signing secrets: debug APK built in verify job; signed release skipped."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Decode keystore in ephemeral runner directory
        if: steps.preflight.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/autochords-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed APK and AAB
        if: steps.preflight.outputs.signed == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verify signed APK and SHA-256 checksum
        id: apk
        if: steps.preflight.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="AutoChords-v${{ steps.preflight.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n1)"
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          echo "signer=$SIGNER" >> "$GITHUB_OUTPUT"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"
      - name: Check compatibility with previous signed release
        id: previous
        if: steps.preflight.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ steps.preflight.outputs.tag }}'
          PREVIOUS=''
          for ITEM in $(git tag -l 'v[0-9]*' --sort=-version:refname); do
            [[ "$ITEM" == "$TAG" ]] && continue
            BODY="$(gh release view "$ITEM" --json body --jq '.body' 2>/dev/null || true)"
            if [[ "$BODY" == *'[SIGNED RELEASE]'* ]]; then PREVIOUS="$ITEM"; break; fi
          done
          if [[ -z "$PREVIOUS" ]]; then
            echo "No previous signed APK: install-over-existing cannot yet be tested."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download "$PREVIOUS" --pattern 'AutoChords-v*.apk' --dir "$RUNNER_TEMP/previous-apk"
          OLD="$(find "$RUNNER_TEMP/previous-apk" -maxdepth 1 -name '*.apk' | head -n1)"
          test -n "$OLD"
          SIGNER='${{ steps.apk.outputs.signer }}'
          NEW='${{ steps.apk.outputs.file }}'
          OLD_CERT="$("$SIGNER" verify --print-certs "$OLD" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          NEW_CERT="$("$SIGNER" verify --print-certs "$NEW" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          if [[ -z "$OLD_CERT" || "$OLD_CERT" != "$NEW_CERT" ]]; then
            echo "::error::Signing certificate does not match previous signed APK."
            exit 1
          fi
          echo "Matching certificate for $PREVIOUS and new APK"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "PREVIOUS_APK=$OLD" >> "$GITHUB_ENV"
          echo "NEW_APK=$NEW" >> "$GITHUB_ENV"
      - name: Emulator upgrade (old signed APK to new)
        if: steps.previous.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            adb install "$PREVIOUS_APK"
            adb install -r "$NEW_APK"
            adb shell dumpsys package com.anderza.autochords | grep 'versionName='
      - name: Archive signed APK, checksum, AAB
        if: steps.preflight.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutoChords-release-${{ steps.preflight.outputs.version }}
          path: |
            AutoChords-v*.apk
            AutoChords-v*.apk.sha256
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable version tag and advance preview tag
        if: steps.preflight.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.preflight.outputs.version }}'
          TAG="v${VERSION}"
          SHA="$GITHUB_SHA"
          APK="AutoChords-v${VERSION}.apk"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            ACTUAL="$(git rev-parse "${TAG}^{commit}")"
            if [[ "$ACTUAL" != "$SHA" ]]; then
              echo "::error::Refusing to move immutable tag $TAG from $ACTUAL to $SHA"
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$TAG" -m "AutoChords $VERSION" "$SHA"
            git push origin "refs/tags/$TAG"
          fi
          PREV="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${SHA}^" 2>/dev/null || true)"
          {
            echo "## AutoChords v$VERSION"
            echo
            echo "[SIGNED RELEASE] Signed using the repository's protected keystore."
            echo
            echo "Built commit: $SHA"
            echo
            echo "### Commits since previous version tag"
            if [[ -n "$PREV" ]]; then
              git log --no-merges --pretty=format:'- %h %s' "$PREV..$SHA"
              echo
            else
              git log -n 12 --no-merges --pretty=format:'- %h %s' "$SHA"
              echo
            fi
            echo
            echo "The SHA-256 checksum is attached next to the APK."
          } > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "AutoChords v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --target "$SHA" --title "AutoChords v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          git tag -f preview "$SHA"
          git push --force origin refs/tags/preview
          if gh release view preview >/dev/null 2>&1; then
            gh release edit preview --title "AutoChords v$VERSION — preview" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          else
            gh release create preview --target "$SHA" --title "AutoChords v$VERSION — preview" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false
          fi
          gh release upload preview "$APK" "$APK.sha256" --clobber
      - name: Remove ephemeral keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/autochords-release.jks"
