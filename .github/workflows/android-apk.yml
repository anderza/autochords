name: Build AutoChords APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Store downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoChords-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish named versioned AutoChords release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read Android versionName"
            exit 1
          fi

          TAG="v${VERSION}"
          TITLE="AutoChords v${VERSION}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ASSET="AutoChords-v${VERSION}.apk"
          NOTES="AutoChords ${VERSION} — предварительная Android APK (debug).

          Эта сборка использует отладочную подпись. Обновление поверх предыдущих APK может не работать, если ключ подписи отличается."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          fi
          # GitHub's #suffix only sets an asset label, not its download filename.
          cp "$APK" "$ASSET"
          gh release upload "$TAG" "$ASSET" --clobber
          # Remove the old generic filename from this versioned release.
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq 'app-debug.apk'; then
            gh release delete-asset "$TAG" app-debug.apk --yes
          fi

          # Keep the old preview URL working for installed/test versions.
          if gh release view preview >/dev/null 2>&1; then
            gh release edit preview --title "${TITLE} — preview" --notes "$NOTES" --prerelease
          else
            gh release create preview --target "$GITHUB_SHA" --title "${TITLE} — preview" --notes "$NOTES" --prerelease --latest=false
          fi
          gh release upload preview "$APK" --clobber
